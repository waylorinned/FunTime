<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FT Anarchy Simulator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'VT323', monospace; background-color: #1a1a1a; color: #fff; overflow: hidden; }

        /* --- МЕНЮ --- */
        #menu-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://minecraft.wiki/images/Dirt_JE4_BE3.png') repeat;
            background-size: 64px 64px; display: flex; flex-direction: column;
            align-items: center; padding: 20px; z-index: 20;
        }
        .menu-header { text-align: center; background: rgba(0, 0, 0, 0.7); padding: 10px 20px; border: 4px solid #555; margin-bottom: 20px; width: 90%; max-width: 600px; }
        .menu-header h1 { font-size: 36px; color: #ffaa00; text-shadow: 2px 2px 0 #000; }
        .menu-header p { font-size: 20px; color: #aaa; }
        
        .server-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; width: 100%; max-width: 1200px; overflow-y: auto; padding-bottom: 50px; touch-action: pan-y; }
        .server-card { background: rgba(0, 0, 0, 0.8); border: 2px solid #333; padding: 15px; cursor: pointer; display: flex; flex-direction: column; }
        .server-top-row { display: flex; justify-content: space-between; align-items: center; }
        .server-name { font-size: 24px; font-weight: bold; }
        .pin-btn { font-size: 28px; color: #555; cursor: pointer; transition: 0.2s; }
        .pin-btn.pinned { color: #ffd700; text-shadow: 0 0 10px #ffaa00; }
        .server-online { color: #55ff55; font-size: 18px; margin-top: 5px; }

        #queue-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 30; justify-content: center; align-items: center; }
        .modal-content { background: #222; border: 4px solid #555; padding: 20px; text-align: center; }
        .modal-content h2 { color: #ff5555; font-size: 28px; margin-bottom: 10px; }
        .cancel-btn { background: #444; border: 2px solid #000; color: #fff; padding: 10px 20px; font-family: inherit; font-size: 18px; cursor: pointer; }

        /* --- ИГРА --- */
        #game-ui { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; touch-action: none; pointer-events: none; }
        
        #cmd-spawn { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); border: 2px solid #555; color: #fff; padding: 5px 20px; font-family: inherit; font-size: 20px; cursor: pointer; pointer-events: auto; z-index: 15; }
        #cmd-spawn:active { background: rgba(50,50,50,0.9); border-color: #fff; }

        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255,255,255,0.7); font-size: 24px; font-family: sans-serif; }
        #balance-ui { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); padding: 5px 10px; font-size: 22px; color: #ffd700; border: 2px solid #333; }
        #stats-ui { position: absolute; bottom: 65px; left: 50%; transform: translateX(-50%); display: flex; justify-content: space-between; width: 320px; font-size: 16px; }
        #hotbar { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; background: rgba(0,0,0,0.6); border: 3px solid #333; padding: 2px; }
        .slot { width: 34px; height: 34px; background: rgba(255,255,255,0.1); border: 2px solid #555; }
        .slot.active { border: 2px solid #fff; }

        #chat-container { position: absolute; top: 50px; left: 10px; width: 70%; max-width: 300px; height: 180px; background: rgba(0, 0, 0, 0.4); padding: 5px; overflow-y: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
        .chat-message { font-size: 16px; line-height: 1.1; margin-bottom: 4px; text-shadow: 1px 1px 0 #000; word-wrap: break-word; }
        .chat-rank-hero { color: #ff55ff; } .chat-rank-holy { color: #ffff55; } .chat-name { color: #ffffff; }

        /* ГОЛОГРАММЫ */
        .hologram { position: absolute; top: 0; left: 0; text-align: center; font-size: 18px; font-weight: bold; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; pointer-events: none; z-index: 5; width: 250px; line-height: 1.2; }

        /* Зоны управления (Сенсор) */
        #touch-zones { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; z-index: 10; pointer-events: auto; }
        .joystick-area { width: 50%; height: 100%; position: relative; }
        #joystick-base { display: none; position: absolute; width: 100px; height: 100px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        #joystick-stick { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; background: rgba(255,255,255,0.5); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="menu-ui">
        <div class="menu-header">
            <h1>FunTime Network</h1>
            <p>Общий онлайн: <span id="total-online">0</span></p>
        </div>
        <div class="server-list" id="server-list"></div>
    </div>

    <div id="queue-modal">
        <div class="modal-content">
            <h2>Очередь на сервер</h2>
            <p>Ваша позиция: <span id="queue-pos">142</span></p><br>
            <button class="cancel-btn" onclick="closeQueue()">Отмена</button>
        </div>
    </div>

    <div id="game-ui">
        <div id="touch-zones">
            <div class="joystick-area" id="zone-move"><div id="joystick-base"><div id="joystick-stick"></div></div></div>
            <div class="joystick-area" id="zone-look"></div>
        </div>
        <button id="cmd-spawn">/spawn</button>
        <div id="crosshair">十</div>
        <div id="balance-ui">💰 1 500 ⛃</div>
        <div id="chat-container"></div>
        <div id="stats-ui">
            <div id="health-bar">❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</div>
            <div id="food-bar">🍗🍗🍗🍗🍗🍗🍗🍗🍗🍗</div>
        </div>
        <div id="hotbar">
            <div class="slot active"></div><div class="slot"></div><div class="slot"></div>
            <div class="slot"></div><div class="slot"></div><div class="slot"></div>
            <div class="slot"></div><div class="slot"></div><div class="slot"></div>
        </div>
    </div>

    <script>
        // --- 1. ГЕНЕРАЦИЯ БОТОВ (ДНК) ---
        const BOTS_COUNT = 200;
        window.activeBots = [];
        const prefixes = ["zxc_", "PvP_", "Pro_", "lil_", "xX_", "", "", ""];
        const roots = ["Killer", "Bebra", "Dimon", "Kroshka", "Nagibator", "Toster", "Voin", "Ded", "Griefer", "Sigma"];
        const suffixes = ["_228", "1337", "2010", "_god", "Ez", "Pro", "", ""];
        const ranks = [{ name: "Игрок", class: "" }, { name: "Hero", class: "chat-rank-hero" }, { name: "Holy", class: "chat-rank-holy" }];

        function generateName() {
            let p = prefixes[Math.floor(Math.random() * prefixes.length)];
            let r = roots[Math.floor(Math.random() * roots.length)];
            let s = suffixes[Math.floor(Math.random() * suffixes.length)];
            return p + r + s + (Math.random() > 0.5 ? Math.floor(Math.random()*99) : "");
        }

        function initBots() {
            for(let i = 0; i < BOTS_COUNT; i++) {
                activeBots.push({
                    id: i, name: generateName(),
                    rank: ranks[Math.random() > 0.7 ? Math.floor(Math.random() * ranks.length) : 0],
                    stats: { pvp: Math.floor(Math.random() * 3), wealth: Math.floor(Math.random() * 3) }
                });
            }
        }

        // --- 2. ЛОГИКА МЕНЮ С ПАМЯТЬЮ (LOCALSTORAGE) ---
        const totalServers = 250;
        const playableServer = 216;
        const serverList = document.getElementById('server-list');
        const queueModal = document.getElementById('queue-modal');
        let queueInterval;
        let totalOnlineCounter = 0;

        let pinnedServers = JSON.parse(localStorage.getItem('ft_pinned_servers') || '[]');

        for (let i = 1; i <= totalServers; i++) {
            const card = document.createElement('div');
            card.className = 'server-card';
            card.dataset.id = i;
            let online = (i === playableServer) ? BOTS_COUNT : Math.floor(Math.random() * 100) + 100;
            totalOnlineCounter += online;

            const isPinned = pinnedServers.includes(i);
            card.innerHTML = `
                <div class="server-top-row">
                    <div class="server-name">Анархия-${i}</div>
                    <div class="pin-btn ${isPinned ? 'pinned' : ''}">★</div>
                </div>
                <div class="server-online">Онлайн: ${online} / 250</div>
            `;
            
            card.querySelector('.pin-btn').onclick = (e) => {
                e.stopPropagation(); 
                const btn = e.target;
                const currentlyPinned = btn.classList.toggle('pinned');
                if (currentlyPinned) { if (!pinnedServers.includes(i)) pinnedServers.push(i); } 
                else { pinnedServers = pinnedServers.filter(id => id !== i); }
                localStorage.setItem('ft_pinned_servers', JSON.stringify(pinnedServers));
                sortServers();
            };
            
            card.onclick = () => connectToServer(i);
            serverList.appendChild(card);
        }
        document.getElementById('total-online').innerText = totalOnlineCounter;
        sortServers();

        function sortServers() {
            const cards = Array.from(serverList.children);
            cards.sort((a, b) => {
                const aP = a.querySelector('.pin-btn').classList.contains('pinned');
                const bP = b.querySelector('.pin-btn').classList.contains('pinned');
                if (aP && !bP) return -1; if (!aP && bP) return 1;  
                return parseInt(a.dataset.id) - parseInt(b.dataset.id);
            });
            cards.forEach(c => serverList.appendChild(c));
        }

        function connectToServer(id) {
            if (id === playableServer) {
                document.getElementById('menu-ui').style.display = 'none';
                document.getElementById('game-ui').style.display = 'block';
                initBots(); initThreeJS(); startChat();
            } else {
                queueModal.style.display = 'flex';
                let pos = Math.floor(Math.random() * 50) + 50; document.getElementById('queue-pos').innerText = pos;
                queueInterval = setInterval(() => { if (Math.random() > 0.8) pos--; document.getElementById('queue-pos').innerText = pos; }, 3000);
            }
        }
        function closeQueue() { queueModal.style.display = 'none'; clearInterval(queueInterval); }

        // --- 3. 3D ДВИЖОК: ФИЗИКА, ГОЛОГРАММЫ И МИРЫ ---
        let scene, camera, renderer, yawObject, pitchObject;
        let moveData = { active: false, id: null, originX: 0, originY: 0, x: 0, y: 0 };
        let lookData = { active: false, id: null, lastX: 0, lastY: 0 };
        const keys = { w: false, a: false, s: false, d: false }; 

        // Игровые переменные
        let currentWorld = 'spawn'; // 'spawn' или 'wild'
        let velocityY = 0;
        let playerBalance = 1500;
        let lastMineTime = 0;
        let lastRtpTime = 0;

        let spawnGroup, wildGroup;
        const holograms = [];

        function addHologram(text, color, position, worldContext) {
            const el = document.createElement('div');
            el.className = 'hologram';
            el.innerHTML = text;
            el.style.color = color;
            document.getElementById('game-ui').appendChild(el);
            holograms.push({ element: el, position: position, world: worldContext });
        }

        function initThreeJS() {
            scene = new THREE.Scene(); scene.background = new THREE.Color(0x87CEEB); scene.fog = new THREE.Fog(0x87CEEB, 10, 60);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.domElement.style.position = 'absolute'; renderer.domElement.style.top = '0'; renderer.domElement.style.zIndex = '-1';
            document.getElementById('game-ui').appendChild(renderer.domElement);

            const light = new THREE.HemisphereLight(0xffffff, 0x444444); light.position.set(0, 200, 0); scene.add(light);

            // === ГРУППА СПАВНА ===
            spawnGroup = new THREE.Group();
            scene.add(spawnGroup);

            // Безопасная платформа спавна (40x40)
            const spawnFloor = new THREE.Mesh(new THREE.BoxGeometry(40, 1, 40), new THREE.MeshLambertMaterial({ color: 0xdddddd }));
            spawnFloor.position.y = 0;
            spawnGroup.add(spawnFloor);

            // Арена СС (Спрыг вниз) (100x100)
            const arenaFloor = new THREE.Mesh(new THREE.BoxGeometry(100, 1, 100), new THREE.MeshLambertMaterial({ color: 0x660000 }));
            arenaFloor.position.y = -10;
            spawnGroup.add(arenaFloor);
            addHologram('АРЕНА СС<br><span style="font-size:14px;color:#ff5555">PvP Включено!</span>', '#ff0000', new THREE.Vector3(0, -5, 25), 'spawn');

            // РТП Портал
            const rtpMesh = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 2), new THREE.MeshLambertMaterial({ color: 0x00aaff, transparent: true, opacity: 0.6 }));
            rtpMesh.position.set(0, 2, -15);
            spawnGroup.add(rtpMesh);
            addHologram('РТП (Телепорт)<br><span style="font-size:12px;color:#ccc">Зайдите внутрь</span>', '#00ffff', new THREE.Vector3(0, 4.5, -15), 'spawn');

            // Автошахта
            const mineMesh = new THREE.Mesh(new THREE.BoxGeometry(6, 1.1, 6), new THREE.MeshLambertMaterial({ color: 0x555555 }));
            mineMesh.position.set(-12, 0.5, 0);
            spawnGroup.add(mineMesh);
            addHologram('Автошахта<br><span style="font-size:12px;color:#ccc">Фарм монет</span>', '#aaaaaa', new THREE.Vector3(-12, 2.5, 0), 'spawn');

            // Аукцион NPC
            const ahMesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2, 1.5), new THREE.MeshLambertMaterial({ color: 0xffaa00 }));
            ahMesh.position.set(12, 1.5, 0);
            spawnGroup.add(ahMesh);
            addHologram('Аукцион /ah<br><span style="font-size:12px;color:#ccc">Скупщик</span>', '#ffff55', new THREE.Vector3(12, 3.5, 0), 'spawn');

            // === ГРУППА ДИКОГО МИРА ===
            wildGroup = new THREE.Group();
            scene.add(wildGroup);
            const wildFloor = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshLambertMaterial({ color: 0x2d5a27 }));
            wildFloor.rotation.x = -Math.PI / 2;
            wildGroup.add(wildFloor);
            wildGroup.visible = false; // Скрыт пока мы на спавне

            // Камера игрока
            yawObject = new THREE.Group(); pitchObject = new THREE.Group();
            scene.add(yawObject); yawObject.add(pitchObject); pitchObject.add(camera);
            yawObject.position.set(0, 5, 0);

            setupControls();
            
            // Кнопка /spawn
            document.getElementById('cmd-spawn').onclick = () => {
                currentWorld = 'spawn';
                spawnGroup.visible = true; wildGroup.visible = false;
                yawObject.position.set(0, 5, 0);
                velocityY = 0;
                pushMessage("<span style='color:#aaaaaa'>[Сервер] Вы телепортированы на спавн.</span>");
            };

            animate();
        }

        function setupControls() {
            window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
            window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

            const zoneMove = document.getElementById('zone-move');
            const zoneLook = document.getElementById('zone-look');
            const joyBase = document.getElementById('joystick-base');
            const joyStick = document.getElementById('joystick-stick');

            zoneMove.addEventListener('touchstart', e => {
                e.preventDefault(); let t = e.changedTouches[0]; moveData.active = true; moveData.id = t.identifier;
                moveData.originX = t.clientX; moveData.originY = t.clientY; moveData.x = 0; moveData.y = 0;
                joyBase.style.display = 'block'; joyBase.style.left = t.clientX + 'px'; joyBase.style.top = t.clientY + 'px';
                joyStick.style.transform = `translate(-50%, -50%)`;
            });

            zoneMove.addEventListener('touchmove', e => {
                e.preventDefault();
                for(let i=0; i<e.changedTouches.length; i++) {
                    let t = e.changedTouches[i];
                    if(t.identifier === moveData.id) {
                        let dx = t.clientX - moveData.originX; let dy = t.clientY - moveData.originY;
                        let distance = Math.sqrt(dx*dx + dy*dy); let maxDist = 40; 
                        if(distance > maxDist) { dx = (dx / distance) * maxDist; dy = (dy / distance) * maxDist; }
                        moveData.x = dx / maxDist; moveData.y = dy / maxDist;
                        joyStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                    }
                }
            });

            const endMove = (e) => {
                for(let i=0; i<e.changedTouches.length; i++) {
                    if(e.changedTouches[i].identifier === moveData.id) {
                        moveData.active = false; moveData.id = null; moveData.x = 0; moveData.y = 0;
                        joyBase.style.display = 'none';
                    }
                }
            };
            zoneMove.addEventListener('touchend', endMove); zoneMove.addEventListener('touchcancel', endMove);

            let isMouseDown = false;
            const startLook = (x, y, id = 'mouse') => { lookData.active = true; lookData.id = id; lookData.lastX = x; lookData.lastY = y; };
            const moveLook = (x, y, id = 'mouse') => {
                if(!lookData.active || lookData.id !== id) return;
                yawObject.rotation.y -= (x - lookData.lastX) * 0.005;
                pitchObject.rotation.x -= (y - lookData.lastY) * 0.005;
                pitchObject.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitchObject.rotation.x));
                lookData.lastX = x; lookData.lastY = y;
            };
            const endLook = (id = 'mouse') => { if(lookData.id === id) lookData.active = false; };

            zoneLook.addEventListener('touchstart', e => { e.preventDefault(); let t = e.changedTouches[0]; startLook(t.clientX, t.clientY, t.identifier); });
            zoneLook.addEventListener('touchmove', e => { e.preventDefault(); for(let i=0; i<e.changedTouches.length; i++) { let t = e.changedTouches[i]; moveLook(t.clientX, t.clientY, t.identifier); }});
            zoneLook.addEventListener('touchend', e => { for(let i=0; i<e.changedTouches.length; i++) endLook(e.changedTouches[i].identifier); });
            
            zoneLook.addEventListener('mousedown', e => { isMouseDown = true; startLook(e.clientX, e.clientY); });
            window.addEventListener('mousemove', e => { if(isMouseDown) moveLook(e.clientX, e.clientY); });
            window.addEventListener('mouseup', () => { isMouseDown = false; endLook(); });
        }

        function updatePhysicsAndTriggers() {
            let groundLevel = -50; // Бездна по умолчанию
            const px = yawObject.position.x;
            const pz = yawObject.position.z;
            
            if (currentWorld === 'spawn') {
                if (Math.abs(px) <= 20 && Math.abs(pz) <= 20) {
                    groundLevel = 0.5; // На спавне
                } else if (Math.abs(px) <= 50 && Math.abs(pz) <= 50) {
                    groundLevel = -9.5; // На Арене СС
                }
            } else if (currentWorld === 'wild') {
                groundLevel = 0; // В диком мире
            }

            yawObject.position.y += velocityY;
            const playerHeight = 1.5;

            // Коллизия с полом
            if (yawObject.position.y - playerHeight <= groundLevel) {
                yawObject.position.y = groundLevel + playerHeight;
                velocityY = 0;
            } else {
                velocityY -= 0.02; // Гравитация (свободное падение)
            }

            // Упал в бездну
            if (yawObject.position.y < -30) {
                yawObject.position.set(0, 5, 0);
                velocityY = 0; currentWorld = 'spawn';
                spawnGroup.visible = true; wildGroup.visible = false;
                pushMessage("<span style='color:#ff5555'>Вы разбились.</span>");
            }

            // ТРИГГЕР: АВТОШАХТА
            if (currentWorld === 'spawn' && Math.abs(px - (-12)) < 3 && Math.abs(pz - 0) < 3) {
                if (Date.now() - lastMineTime > 1000) {
                    playerBalance += 10;
                    document.getElementById('balance-ui').innerText = '💰 ' + playerBalance + ' ⛃';
                    lastMineTime = Date.now();
                }
            }

            // ТРИГГЕР: РТП
            if (currentWorld === 'spawn' && Math.abs(px - 0) < 2 && Math.abs(pz - (-15)) < 2) {
                if (Date.now() - lastRtpTime > 5000) {
                    currentWorld = 'wild';
                    spawnGroup.visible = false; wildGroup.visible = true;
                    // Кидаем в рандомную точку на карте 2000х2000
                    yawObject.position.set(Math.floor(Math.random()*2000 - 1000), 50, Math.floor(Math.random()*2000 - 1000));
                    pushMessage("<span style='color:#00ffff'>[РТП] Телепортация: X: " + Math.floor(yawObject.position.x) + " Z: " + Math.floor(yawObject.position.z) + "</span>");
                    lastRtpTime = Date.now();
                }
            }
        }

        function updateHolograms() {
            const tempV = new THREE.Vector3();
            holograms.forEach(holo => {
                if (holo.world !== currentWorld) { holo.element.style.display = 'none'; return; }
                
                tempV.copy(holo.position);
                tempV.project(camera);
                
                // Если за спиной
                if (tempV.z > 1 || tempV.z < -1) { holo.element.style.display = 'none'; return; }
                
                holo.element.style.display = 'block';
                const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
                const y = (tempV.y * -0.5 + 0.5) * window.innerHeight;
                holo.element.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const speed = 0.2;
            
            if (keys.w) yawObject.translateZ(-speed);
            if (keys.s) yawObject.translateZ(speed);
            if (keys.a) yawObject.translateX(-speed);
            if (keys.d) yawObject.translateX(speed);

            if (moveData.active) {
                yawObject.translateX(moveData.x * speed);
                yawObject.translateZ(moveData.y * speed);
            }

            updatePhysicsAndTriggers();
            updateHolograms();
            renderer.render(scene, camera);
        }

        // --- 4. ДИНАМИЧЕСКИЙ ЧАТ ---
        const chatContainer = document.getElementById('chat-container');
        function pushMessage(htmlText) {
            const msg = document.createElement('div');
            msg.className = 'chat-message'; msg.innerHTML = htmlText;
            chatContainer.appendChild(msg);
            if (chatContainer.children.length > 8) chatContainer.removeChild(chatContainer.firstChild);
        }

        function startChat() {
            pushMessage("<span style='color:#ff5555'>[Система] Загружено 200 ИИ-игроков.</span>");
            
            setInterval(() => {
                const bot = window.activeBots[Math.floor(Math.random() * window.activeBots.length)];
                let msg = "";
                let randomTarget = window.activeBots[Math.floor(Math.random() * window.activeBots.length)].name;

                if (bot.stats.pvp >= 1 && Math.random() > 0.5) {
                    const toxic = [ `ezzzzz`, `${randomTarget} нуль ливай`, `кто 1х1 на арену сс?`, `${randomTarget} софтер оффни` ];
                    msg = toxic[Math.floor(Math.random() * toxic.length)];
                } else if (bot.stats.wealth >= 1 && Math.random() > 0.5) {
                    const trade = [ `! продам крушак за 2кк`, `чекайте /ah сливаю ресы`, `кто даст шалкер за монеты?` ];
                    msg = trade[Math.floor(Math.random() * trade.length)];
                } else {
                    const noob = [ `кто приютит я без ресов`, `как тут приватить?`, `где мистик?` ];
                    msg = noob[Math.floor(Math.random() * noob.length)];
                }

                const prefix = bot.rank.name === "Игрок" ? "" : `[${bot.rank.name}] `;
                pushMessage(`<span class="${bot.rank.class}">${prefix}</span><span class="chat-name">${bot.name} ➯</span> ${msg}`);
            }, 3000);

            setInterval(() => {
                pushMessage("<span style='color:#ff5555'>⚜ Мистический сундук упал на X: " + (Math.floor(Math.random()*2000)-1000) + " Z: " + (Math.floor(Math.random()*2000)-1000) + "</span>");
            }, 25000);
        }
    </script>
</body>
</html>
